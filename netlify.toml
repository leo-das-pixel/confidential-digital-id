[build]
  base = "cipherid-ui"
  command = "npm run build"
  publish = "dist"

# Browser → same-origin /proof-server/* (avoids CORS on proof-server.preprod.midnight.network)
[[redirects]]
  from = "/proof-server/*"
  to = "https://proof-server.preprod.midnight.network/:splat"
  status = 200
  force = true

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
