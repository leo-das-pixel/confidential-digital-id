[build]
  base = "cipherid-ui"
  command = "npm run build"
  publish = "dist"

# Same-origin proof-server proxy (must win over SPA fallback).
# Also mirrored in cipherid-ui/public/_redirects so it ships in dist.
[[redirects]]
  from = "/proof-server/*"
  to = "https://proof-server.preprod.midnight.network/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
