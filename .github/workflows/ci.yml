name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x

    - name: Install workspace dependencies
      run: npm install

    - name: Compile contract
      run: |
        if command -v compact >/dev/null 2>&1; then
          npm run compile
        else
          echo "Using pre-compiled managed contract artifacts."
        fi

    - name: Run test suite
      run: npm test

    - name: UI build
      run: npm run build --workspace=@midnight-ntwrk/cipherid-ui
